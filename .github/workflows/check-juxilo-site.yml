name: JUXILO – Vorschauseite prüfen

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/check-juxilo-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Website-Dateien und JavaScript prüfen
        run: |
          set -euo pipefail
          node --check site/assets/site.js
          for file in site/index.html site/impressum.html site/datenschutz.html site/assets/site.css site/assets/showcase.css site/assets/juxilo-logo.svg site/assets/juxilo-icon.svg site/assets/juxilo-favicon.svg site/favicon.ico site/assets/favicon-32.png site/robots.txt site/sitemap.xml; do
            test -s "$file"
          done

      - name: Vorschauseite ohne Demo-Verweise und defekte Links prüfen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root = Path('site').resolve()
          html_files = list(root.rglob('*.html'))
          assert len(html_files) == 3, 'Erwartet: Startseite, Impressum, Datenschutz'
          errors = []

          class Links(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('src', 'href'):
                      value = attrs.get(key)
                      if not value:
                          continue
                      low = value.lower()
                      if 'demo.juxilo.de' in low or 'test.wer-muss.wiedeck.de' in low or '/apps/' in low:
                          errors.append(f'Verbotener Demo-Verweis: {self.page.name}: {value}')
                      url = urlsplit(value)
                      if url.scheme or url.netloc or value.startswith(('#', 'mailto:', 'tel:')):
                          continue
                      if url.path:
                          path = (self.page.parent / url.path).resolve()
                          if url.path.endswith('/'):
                              path /= 'index.html'
                          if not path.is_relative_to(root) or not path.exists():
                              errors.append(f'Defekter lokaler Link: {self.page.name}: {value}')

          for page in html_files:
              html = page.read_text(encoding='utf-8')
              assert 'MW-JUXILO-2026' in html, f'Wasserzeichen fehlt: {page}'
              Links(page).feed(html)
          for page in html_files:
              page_text = page.read_text(encoding='utf-8')
              assert 'favicon.ico?v=2' in page_text, f'ICO-Favicon fehlt: {page.name}'
              assert 'favicon-32.png?v=2' in page_text, f'PNG-Fallback fehlt: {page.name}'
          assert (root / 'favicon.ico').read_bytes().startswith(b'\x00\x00\x01\x00'), 'Favicon.ico hat keinen korrekten ICO-Header'
          assert (root / 'assets' / 'favicon-32.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), 'Favicon-PNG fehlt oder ist beschädigt'
          for page in html_files:
              footer_html = page.read_text(encoding='utf-8')
              assert footer_html.count('class="mw-credit"') == 1, f'MW-Footerhinweis fehlt oder doppelt: {page.name}'
              assert 'src="./assets/mw-logo-original.png"' in footer_html, f'Original-MW-Logo fehlt: {page.name}'
              assert 'href="https://wiedeck.de/"' in footer_html, f'MW-Credit ohne Wied eck-Link: {page.name}'
          assert (root / 'assets' / 'mw-logo-original.png').read_bytes().startswith(b'\\x89PNG'), 'Original-MW-Logo fehlt'
          homepage = (root / 'index.html').read_text(encoding='utf-8').lower()
          css = (root / 'assets' / 'site.css').read_text(encoding='utf-8')
          assert '@keyframes jx04-mascot-wave' in css, 'JUXILO-J-Animation fehlt'
          assert '@keyframes jx04-mascot-hello' in css, 'JUXILO-J-Hover-Animation fehlt'
          assert 'prefers-reduced-motion: reduce' in css, 'Animation muss Bewegung reduzieren respektieren'
          for marker in ['wer muss?!', 'fingerchaos', 'punktlandung', 'nicht kleckern', 'nur noch einmal', 'völlig daneben']:
              if marker not in homepage:
                  errors.append('App auf der öffentlichen Vorschauseite fehlt: ' + marker)
          assert homepage.count('class="teaser-card teaser-card--') == 6, 'Alle sechs App-Kacheln müssen angezeigt werden'
          assert homepage.count('class="teaser-phone"') == 6, 'Jede Kachel benötigt eine kleine Handy-Illustration'
          assert '<link rel="stylesheet" href="./assets/showcase.css">' in homepage, 'Showcase-CSS nicht eingebunden'
          assert (root / 'assets' / 'showcase.css').stat().st_size > 2000, 'Showcase-Styles fehlen'
          icons = ['wer-muss.svg','punktlandung.webp','fingerchaos.webp','nicht-kleckern.webp','nur-noch-einmal.webp','voellig-daneben.webp']
          for icon in icons:
              assert (root / 'assets' / 'icons' / icon).is_file(), 'Fehlendes JUXILO-App-Icon: ' + icon
          assert not any('href="./assets/icons/' in p.read_text(encoding='utf-8') for p in html_files), 'Icons dürfen nicht zu Demo-Links werden'
          assert not any('href="https://demo.juxilo.de' in p.read_text(encoding='utf-8') for p in html_files), 'Keine öffentlichen Demo-Verweise erlaubt'
          for f in (root / 'assets').glob('*.svg'):
              svg = f.read_text(encoding='utf-8')
              assert '<svg ' in svg and '</svg>' in svg and '<image ' not in svg, f'Ungültiges Vektorlogo: {f}'
          if errors:
              raise SystemExit('\n'.join(errors))
          print('JUXILO-Website geprüft: sechs App-Kacheln, keine Demo-Links, alle lokalen Dateien vorhanden.')
          PY
