name: JUXILO-Spaß-Apps – Testseite manuell hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wer-muss-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Website und Browser-Tests per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Website und Testseiten prüfen
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            demo/index.html \
            demo/apps/wer-muss/index.html \
            demo/apps/punktlandung/index.html \
            demo/apps/fingerchaos/index.html \
            demo/apps/nicht-kleckern/index.html \
            demo/apps/nur-noch-einmal/index.html \
            demo/apps/voellig-daneben/index.html \
            demo/assets/mini-apps.css \
            demo/assets/juxilo.css \
            demo/assets/mini-apps.js \
            demo/wm04b-logo.svg \
            demo/assets/juxilo.css \
            demo/assets/juxilo-jx04-icon.svg \
            demo/assets/juxilo-jx04-logo-light.svg \
            demo/assets/juxilo-jx04-logo-dark.svg \
            demo/assets/juxilo-jx04-logo-horizontal.svg \
            demo/assets/juxilo-jx04-app-icon.svg \
            demo/impressum.html \
            demo/datenschutz.html; do
            test -s "$file"
          done
          grep -iq '<!doctype html>' demo/index.html
          grep -iq 'Wer muss' demo/index.html
          grep -iq 'JUXILO' demo/index.html

      - name: Wasserzeichen vor Veröffentlichung prüfen
        shell: bash
        run: |
          set -euo pipefail
          fingerprint='MW-WMA-2026-8d573e4b'
          for page in \
            demo/index.html \
            demo/apps/wer-muss/index.html \
            demo/apps/punktlandung/index.html \
            demo/apps/fingerchaos/index.html \
            demo/apps/nicht-kleckern/index.html \
            demo/apps/nur-noch-einmal/index.html \
            demo/apps/voellig-daneben/index.html \
            demo/impressum.html \
            demo/datenschutz.html; do
            grep -Fq "<meta name=\"source-fingerprint\" content=\"${fingerprint}\">" "$page" || { echo "::error::Wasserzeichen fehlt: $page"; exit 1; }
          done
          for file in \
            demo/assets/mini-apps.css \
            demo/assets/mini-apps.js \
            demo/assets/scroll-ui.css \
            demo/assets/scroll-ui.js \
            demo/assets/language.js; do
            grep -Fq "$fingerprint" "$file" || { echo "::error::Wasserzeichen fehlt: $file"; exit 1; }
          done

      - name: FTP-Server auf Erreichbarkeit prüfen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_SERVER fehlt als Repository-Secret}"
          if [[ "$FTP_HOST" == *"://"* || "$FTP_HOST" == *"/"* || "$FTP_HOST" == *":"* || "$FTP_HOST" == *[[:space:]]* ]]; then
            echo "::error::FTP_SERVER muss nur den Server-Hostnamen enthalten (ohne Protokoll, Port oder Verzeichnis). Siehe ALL-INKL KAS -> FTP."
            exit 1
          fi
          if ! getent ahostsv4 "$FTP_HOST" >/dev/null && ! getent ahostsv6 "$FTP_HOST" >/dev/null; then
            echo "::error::FTP_SERVER ist im GitHub-Runner nicht per DNS auflösbar. Bitte den Servernamen unter ALL-INKL KAS -> FTP mit dem GitHub-Secret FTP_SERVER vergleichen."
            exit 1
          fi
          reachable=false
          for attempt in 1 2 3; do
            if nc -z -w 10 "$FTP_HOST" 21 >/dev/null 2>&1; then
              reachable=true
              break
            fi
            if (( attempt < 3 )); then sleep 4; fi
          done
          if [[ "$reachable" != "true" ]]; then
            echo "::error::FTP-Server ist über Port 21 von GitHub Actions aus nicht erreichbar. KAS -> FTP: korrekten Server-Hostnamen kontrollieren, FTP/FTPS-Freigabe bzw. Server-Firewall prüfen. Es wurden keine Dateien übertragen."
            exit 1
          fi
          echo "FTP-Server auf Port 21 erreichbar; FTPS-Upload startet."

      - name: Alle Website-Dateien und Unterordner per FTPS hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_SERVER fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USERNAME fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          while IFS= read -r -d '' file; do
            relative="${file#demo/}"
            echo "Übertrage $relative …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv \
              --ftp-create-dirs --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 3 \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$relative"
          done < <(find demo -type f -not -name '.DS_Store' -print0 | sort -z)
          echo "Website und Browser-Tests erfolgreich übertragen."
