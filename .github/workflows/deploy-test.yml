name: Testseite manuell hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wer-muss-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Browser-Demo per FTPS hochladen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Browser-Demo per FTPS in FTP-Startverzeichnis hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./demo/
          server-dir: ./
          dangerous-clean-slate: false
