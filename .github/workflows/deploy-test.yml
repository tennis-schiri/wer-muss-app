name: Testseite manuell hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wer-muss-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Browser-Demo per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Demo-Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s demo/index.html
          test -s demo/README.txt
          grep -iq '<!doctype html>' demo/index.html

      - name: Browser-Demo sicher per FTPS hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_SERVER fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USERNAME fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          for file in index.html README.txt; do
            echo "Übertrage $file …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "demo/$file" \
              "ftp://${FTP_HOST}:21/$file"
          done
          echo "Testseite erfolgreich übertragen."
