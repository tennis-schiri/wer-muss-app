name: Wer-muss-Website und Mini-App-Tests manuell hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wer-muss-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Website und Browser-Tests per FTPS hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Website und Testseiten prüfen
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            demo/index.html \
            demo/apps/wer-muss/index.html \
            demo/apps/punktlandung/index.html \
            demo/apps/fingerchaos/index.html \
            demo/apps/nicht-kleckern/index.html \
            demo/apps/nur-noch-einmal/index.html \
            demo/apps/voellig-daneben/index.html \
            demo/assets/mini-apps.css \
            demo/assets/mini-apps.js \
            demo/wm04b-logo.svg \
            demo/impressum.html \
            demo/datenschutz.html; do
            test -s "$file"
          done
          grep -iq '<!doctype html>' demo/index.html
          grep -iq 'Wer muss' demo/index.html

      - name: Alle Website-Dateien und Unterordner per FTPS hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_SERVER fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USERNAME fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          while IFS= read -r -d '' file; do
            relative="${file#demo/}"
            echo "Übertrage $relative …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv \
              --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$relative"
          done < <(find demo -type f -not -name '.DS_Store' -print0 | sort -z)
          echo "Website und Browser-Tests erfolgreich übertragen."
