name: Mini-App-Browserseiten prüfen

on:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/check-mini-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JavaScript-Syntax prüfen
        run: node --check demo/assets/mini-apps.js

      - name: JUXILO-Sprachwechsel und Scrollnavigation prüfen
        run: |
          node --check demo/assets/language.js
          node --check demo/assets/scroll-ui.js
          node --check demo/assets/mini-apps.js
          test -s demo/assets/cartoon-coffee.css
          test -s demo/assets/juxilo.css
          for logo in icon logo-dark logo-light logo-horizontal app-icon; do
            test -s "demo/assets/juxilo-jx04-${logo}.svg"
          done
          grep -q 'JUXILO' demo/index.html

      - name: Smartphone-Vorschauen und spielbare Handy-Demos prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          demo = Path('demo')
          home = (demo / 'index.html').read_text(encoding='utf-8')
          assert home.count('class="mini-phone-preview"') == 6, 'Es müssen sechs eigene Handy-Vorschauen erscheinen.'
          assert home.count('class="mini-phone-hardware"') == 6, 'Jede App-Kachel braucht einen Handy-Rahmen.'
          assert 'class="app-card featured' not in home, 'Keine JUXILO-App darf größer hervorgehoben werden.'
          assert home.count('class="app-card app-') == 6, 'Alle Apps müssen das identische Kartenlayout verwenden.'
          assert home.count('class="status preview">BROWSER-TEST</span>') == 6, 'Alle Apps brauchen denselben Kartenstatus.'
          phones = (demo / 'assets' / 'phone-frames.css').read_text(encoding='utf-8')
          assert 'grid-auto-rows: 1fr;' in phones, 'Einheitlich hohe Kachelreihen fehlen.'
          assert '.app-card.featured' not in phones, 'Spezialgrößen für die erste App sind noch aktiv.'
          for slug in ['punktlandung', 'fingerchaos', 'nicht-kleckern', 'nur-noch-einmal', 'voellig-daneben']:
              page = (demo / 'apps' / slug / 'index.html').read_text(encoding='utf-8')
              assert 'phone-frames.css' in page, f'Smartphone-Styles fehlen in {slug}'
              assert page.count('class="device-phone"') == 1, f'Kein eindeutiger interaktiver Handy-Rahmen in {slug}'
              assert page.count('class="device-viewport"') == 1, f'Kein scrollbarer Handy-Bildschirm in {slug}'
              assert page.index('class="device-viewport"') < page.index('class="game-board"'), f'Spielfeld liegt außerhalb des Handys in {slug}'
              assert page.count('class="game-board"') == 1, f'Spielfeld mehrfach vorhanden in {slug}'
              assert 'id="restart-app"' in page, f'Neustart fehlt in {slug}'
          wm = (demo / 'apps' / 'wer-muss' / 'index.html').read_text(encoding='utf-8')
          assert wm.count('class="wm-phone-outer"') == 1
          assert wm.count('class="wm-phone-content"') == 1
          assert wm.count('id="stage"') == 1
          assert wm.index('class="wm-phone-content"') < wm.index('id="stage"')
          assert '?fullscreen=1' in wm, 'Vollbildmodus für Mehrfinger-Test fehlt'
          assert (demo / 'assets' / 'phone-frames.css').stat().st_size > 1000
          nk = (demo / 'apps' / 'nicht-kleckern' / 'index.html').read_text(encoding='utf-8')
          assert 'cartoon-coffee.css' in nk, 'Cartoon-Kaffee-Styling fehlt in der spielbaren Demo'
          assert 'class="cup-assembly"' in nk and 'id="cup-scene"' in nk, 'Neue Tassenform fehlt'
          assert 'id="coffee"' in nk and 'coffee-surface' in nk, 'Dynamische Kaffeeoberfläche fehlt'
          assert 'coffee-sloshing' in (demo / 'assets' / 'mini-apps.js').read_text(encoding='utf-8'), 'Schwapp-Animation nicht mit Spiel verbunden'
          assert 'mini-coffee-smile' in home, 'Neue Kaffee-Vorschau fehlt'
          assert (demo / 'assets' / 'cartoon-coffee.css').stat().st_size > 2000, 'Cartoon-Tassen-CSS fehlt'
          pl = (demo / 'apps' / 'punktlandung' / 'index.html').read_text(encoding='utf-8')
          assert all(f'data-target="{value}"' in pl for value in ('5','10','15')), 'Zielzeit-Vorgaben fehlen'
          assert 'id="custom-target"' in pl and 'inputmode="decimal"' in pl, 'Freie Zielzeit oder Dezimaltastatur fehlt'
          assert 'id="custom-target-hint"' in pl, 'Hinweis zur Nachkommastelle fehlt'
          assert 'mini-time-custom' in home, 'Eigene Zielzeit in Handy-Vorschau fehlt'
          js = (demo / 'assets' / 'mini-apps.js').read_text(encoding='utf-8')
          assert 'function parseCustom()' in js and 'Number(value.replace' in js, 'Dezimaleingabe wird nicht verarbeitet'
          assert 'usingCustom' in js and 'customInput.disabled=true' in js, 'Eigene Zielzeit wird während des Laufs nicht gesperrt'
          assert 'formatTarget(target)' in js, 'Zielzeit wird nicht auf eine Nachkommastelle formatiert'
          lang = (demo / 'assets' / 'language.js').read_text(encoding='utf-8')
          assert '"Eigene Zeit": "Custom time"' in lang, 'Englische Beschriftung fehlt'
          print('Sechs Smartphone-Vorschauen, sechs spielbare Handy-Demos und Vollbildmodus geprüft.')
          PY

      - name: Interne Links der Mini-App-Seiten prüfen
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path("demo").resolve()
          errors = []

          class Links(HTMLParser):
              def __init__(self, source):
                  super().__init__()
                  self.source = source

              def handle_starttag(self, tag, attrs):
                  for key, raw in attrs:
                      if key not in ("src", "href") or not raw:
                          continue
                      link = urlsplit(raw)
                      if link.scheme or link.netloc or raw.startswith(("#", "mailto:")):
                          continue
                      if not link.path:
                          continue
                      target = (self.source.parent / link.path).resolve()
                      if not target.is_relative_to(root) or not target.exists():
                          errors.append(f"{self.source.relative_to(root)}: {raw}")

          pages = list(root.rglob("*.html"))
          for page in pages:
              Links(page).feed(page.read_text(encoding="utf-8"))
          assert len(pages) >= 9, "Mindestens Startseite, sechs Tests und zwei rechtliche Seiten erwartet"
          if errors:
              raise SystemExit("Fehlende lokale Ziele:\n" + "\n".join(errors))
          print(f"{len(pages)} HTML-Dateien und interne Links geprüft.")
          games = sorted((root / "apps").glob("*/index.html"))
          assert len(games) == 6, f"Sechs Browser-Spiele erwartet, gefunden: {len(games)}"
          for page in games:
              html = page.read_text(encoding="utf-8")
              assert 'id="restart-app"' in html, f"Neustart fehlt auf {page}"
              assert 'href="../../index.html"' in html, f"Zur Startseite fehlt auf {page}"
          print("Neustart und Startseiten-Link auf allen sechs Spielseiten vorhanden.")
          PY
